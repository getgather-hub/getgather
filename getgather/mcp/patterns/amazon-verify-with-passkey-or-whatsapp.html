<html rb-domain="amazon-mock.dataportrait.app" rb-priority="3">
  <head>
    <title>Verify with WhatsApp</title>
  </head>
  <body>
    <div
      rb-match="//div[contains(@class, 'a-alert-content')]//div[contains(@class, 'cvf-alert-section')][contains(normalize-space(.), 'unable to send an SMS')]"
    ></div>
    <div
      rb-autoclick
      rb-match="//span[@id='secondary_channel_button']//span[@id='secondary_channel_button-announce'][contains(normalize-space(.), 'Verify using WhatsApp')]"
    >
      Verify using WhatsApp
    </div>
  </body>
</html>
