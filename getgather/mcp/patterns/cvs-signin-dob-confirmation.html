<html rb-domain="cvs" rb-humanize rb-after-submit-delay-ms="5000">
  <head>
    <title>Sign In to CVS</title>
  </head>

  <body>
    <h1
      rb-match="h1#headerIndex"
      style="display: inline; font-size: 1rem; font-weight: 600; margin: 0"
    >
      Enter date of birth
    </h1>
    <p rb-match="div#subHeader" style="display: inline"></p>

    <div rb-optional rb-match="ps-alert-bar div[slot='heading']"></div>

    <div class="dob-container">
      <input
        name="month"
        type="text"
        inputmode="numeric"
        data-testid="month"
        rb-match="input#month"
        placeholder="MM"
        maxlength="2"
      />
      <span class="dob-separator" aria-hidden="true">/</span>
      <input
        name="day"
        type="text"
        inputmode="numeric"
        data-testid="day"
        rb-match="input#day"
        placeholder="DD"
        maxlength="2"
      />
      <span class="dob-separator" aria-hidden="true">/</span>
      <input
        name="year"
        type="text"
        inputmode="numeric"
        data-testid="year"
        rb-match="input#year"
        placeholder="YYYY"
        maxlength="4"
      />
    </div>

    <style>
      .dob-container {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.5rem;
      }

      .dob-container input {
        width: 4.5rem;
        text-align: center;
      }

      .dob-container input[name="year"] {
        width: 5.5rem;
      }

      .dob-separator {
        color: #6b7280;
        font-weight: 500;
        user-select: none;
      }
    </style>

    <button
      type="submit"
      data-testid="submit"
      rb-match="form.form-container button[data-test='continue']"
    >
      Verify date of birth
    </button>
  </body>
</html>
