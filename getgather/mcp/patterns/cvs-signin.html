<html
  rb-domain="cvs"
  rb-trusted-actions
  rb-humanize
  rb-reload-before-actions
  rb-settle-ms="8000"
  rb-pre-action-idle-ms="2000"
  rb-submit-delay-ms="3000"
>
  <head>
    <title>Sign In to CVS</title>
  </head>
  <body>
    <h1>Sign in to your account</h1>
    <input
      name="email"
      type="text"
      data-testid="email"
      rb-match="input[autocomplete='username']"
      placeholder="Mobile number or email"
    />
    <button type="submit" rb-autoclick rb-match="ps-button.profile-button > button[type='button']">
      Continue
    </button>
  </body>
</html>
