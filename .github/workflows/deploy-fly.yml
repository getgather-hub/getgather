name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo:
        description: Deploy remotebrowser (demo)
        required: false
        type: boolean
        default: true
      dev:
        description: Deploy remotebrowser-dev
        required: false
        type: boolean
        default: true
      daytona:
        description: Deploy remotebrowser-daytona
        required: false
        type: boolean
        default: true
      browserbase:
        description: Deploy remotebrowser-browserbase
        required: false
        type: boolean
        default: true
      daytona_cloakbrowser_pro:
        description: Deploy remotebrowser-daytona-cloakbrowser-pro
        required: false
        type: boolean
        default: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.pm.outputs.matrix }}
    steps:
      - id: pm
        uses: remotebrowser/shared-github-actions/prepare-matrix@v1
        with:
          entries: |
            { "env": "demo",        "config": "demo",        "app_name": "remotebrowser"     }
            { "env": "dev",         "config": "dev",         "app_name": "remotebrowser-dev" }
            { "env": "daytona",     "config": "daytona",     "app_name": "remotebrowser-daytona" }
            { "env": "browserbase", "config": "browserbase", "app_name": "remotebrowser-browserbase" }
            { "env": "daytona-cloakbrowser-pro", "config": "daytona", "app_name": "remotebrowser-daytona-cloakbrowser-pro" }
          selections: |
            ${{ inputs.demo        && 'demo'        || '' }}
            ${{ inputs.dev         && 'dev'         || '' }}
            ${{ inputs.daytona     && 'daytona'     || '' }}
            ${{ inputs.browserbase && 'browserbase' || '' }}
            ${{ inputs.daytona_cloakbrowser_pro && 'daytona-cloakbrowser-pro' || '' }}
          key-field: env

  deploy:
    needs: prepare-matrix
    name: Deploy ${{ matrix.app_name }}
    runs-on: ubuntu-22.04
    concurrency: deploy-${{ matrix.app_name }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: remotebrowser/shared-github-actions/deploy-fly@v1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: remotebrowser
          doppler-config: daytona
          app-name: ${{ matrix.app_name }}
          build-args: ${{ contains(fromJSON('["daytona","daytona-cloakbrowser-pro"]'), matrix.env) && 'BROWSER_BACKEND=daytona' || '' }}
